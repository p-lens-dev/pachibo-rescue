name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: mac
            args: --target universal-apple-darwin --config src-tauri/bundle-adb.json
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            os: windows
            args: --config src-tauri/bundle-adb.json
            targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - run: bun install --frozen-lockfile
      - name: Bundle adb (Android Platform Tools)
        shell: bash
        # Fails here, not mid-build, where adb was not staged.
        run: |
          bash scripts/fetch-adb.sh ${{ matrix.os }}
          ls src-tauri/binaries/adb*
      - id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_END'
            cat .github/release-notes.md
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bunx tauri
          tagName: ${{ github.ref_name }}
          releaseName: pachibo-rescue ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}
